name: flight-watch

# 机票盯价云端：每小时查一次 Trip.com，跌破理想价推手机，每晚发日报，结果写回 flight-watch/ 给手机页面。
# GitHub 自带的定时不准（实测会拖几小时），主触发靠 cron-job.org 每小时调 workflow_dispatch；
# 下面的 schedule 只是兜底。代码由本机 flight-watch/cloud_sync.sh 推上来，别在这里直接改。
on:
  schedule:
    - cron: "17 * * * *"       # 兜底；主触发是 cron-job.org，两者靠下面的「限流」不会重复查
  workflow_dispatch:
    inputs:
      force:
        description: "忽略限流，马上查一次"
        type: boolean
        default: false
  # 手机页面「立即查价」写这个文件，推送即触发
  push:
    branches: [main]
    paths: [flight-watch/check-request.json]

concurrency:
  group: flight-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04     # 别用 ubuntu-latest：2026-10 它升到 26.04，Playwright 1.59 不支持，装浏览器那步会失败
    timeout-minutes: 25
    env:
      TZ: Australia/Sydney
    steps:
      - uses: actions/checkout@v4

      # 限流：公开仓库不限分钟，这里只是防止定时和 cron-job.org 重复查，对 Trip.com 保持低频。
      # 距离上次云端查价不足 50 分钟就跳过；手机「立即查价」(push) 和勾了 force 的手动运行不受限。
      - name: Guard
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime
          ev, force = os.environ["EVENT"], os.environ.get("FORCE") == "true"
          limit = None if force else {"schedule": 50, "workflow_dispatch": 50}.get(ev)
          skip = False
          if limit:
              try:
                  st = json.load(open("flight-watch/status.json"))
                  # 只认云端自己写的：Mac 接手时也会更新 status.json，算进去云端就永远恢复不了
                  if st.get("source") == "cloud":
                      skip = (datetime.now() - datetime.fromisoformat(st["generated_at"])).total_seconds() / 60 < limit
              except Exception:
                  pass
          print("skip=" + ("true" if skip else "false"))
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/flight-watch.yml

      # 浏览器缓存起来，每次能省 1 分钟左右（私有仓库每月免费 2000 分钟）
      - uses: actions/cache@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.59.0-chromium

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -q playwright==1.59.0 matplotlib==3.11.2
          python -m playwright install --with-deps chromium
          # 晚上要发日报，装中文字体（白天不装，省时间）
          if [ "$(date +%H)" -ge 20 ]; then sudo apt-get install -y -qq fonts-noto-cjk >/dev/null; fi

      - name: Check prices
        if: steps.guard.outputs.skip != 'true'
        env:
          FW_WEBHOOK_URL: ${{ secrets.FW_WEBHOOK_URL }}
        run: |
          if [ -z "$FW_WEBHOOK_URL" ]; then
            echo "::error::仓库 Secret FW_WEBHOOK_URL 没设置：查到低价也推不到手机。到 Settings > Secrets and variables > Actions 添加。"
            exit 1
          fi
          case "$FW_WEBHOOK_URL" in
            https://*) ;;
            *) echo "::error::Secret FW_WEBHOOK_URL 不是网址（应以 https:// 开头，比如 https://ntfy.sh/你的主题）。请重新设置。"; exit 1 ;;
          esac
          python flight-watch/cloud/cloud_run.py

      - name: Save results
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "flight-watch-cloud"
          git config user.email "actions@users.noreply.github.com"
          git add flight-watch/cloud-data flight-watch/status.json
          git diff --cached --quiet && exit 0
          git commit -qm "机票盯价：云端查价结果"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
