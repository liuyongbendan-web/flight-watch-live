name: flight-query

# 按需查询：聊天里的 Claude 经 GitHub 连接器写 flight-watch/query/request.json，推送即触发；
# 查完把结果写到 flight-watch/query/result.json。和每小时盯价（flight-watch.yml）互不排队。
# 代码由本机 flight-watch/cloud_sync.sh 推上来，别在这里直接改。
on:
  push:
    branches: [main]
    paths: [flight-watch/query/request.json]

concurrency:
  group: flight-query
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-24.04     # 同 flight-watch.yml：别用 ubuntu-latest，Playwright 1.59 不支持 26.04
    timeout-minutes: 10
    env:
      TZ: Australia/Sydney
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/flight-query.yml

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.59.0-chromium

      - name: Install
        run: |
          pip install -q playwright==1.59.0
          python -m playwright install --with-deps chromium

      - name: Query
        run: python flight-watch/cloud/cloud_query.py

      - name: Save result
        if: always()
        run: |
          git config user.name "flight-watch-cloud"
          git config user.email "actions@users.noreply.github.com"
          git add flight-watch/query/result.json
          git diff --cached --quiet && exit 0
          git commit -qm "按需查询：结果"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
